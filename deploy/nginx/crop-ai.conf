# crop-ai — nginx 설정 (화면 정적 파일 + /api 프록시)
#   설치 위치: /etc/nginx/conf.d/crop-ai.conf
#   다른 장비·도메인에서 바꿀 곳: server_name, root, upstream 주소
#   적용: sudo nginx -t && sudo nginx -s reload   (systemd면 sudo systemctl reload nginx)

upstream crop_backend {
    server 127.0.0.1:8080;          # Spring이 다른 장비면 그 내부 IP로 (방화벽은 이 nginx IP만 허용)
    # server 10.0.0.21:8080;        # Spring을 더 두면 줄만 추가 → 자동 분산
    keepalive 16;
}

server {
    listen 80;
    server_name crop-ai.taeun.org;

    root  /var/www/crop-ai;         # scripts/deploy-front.sh 가 빌드 결과를 복사하는 곳
    index index.html;

    access_log /var/log/nginx/crop-ai.access.log;
    error_log  /var/log/nginx/crop-ai.error.log;

    # 화면: React Router 주소에서 새로고침해도 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일 이름에 해시가 붙어 있어 오래 캐시해도 됨
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → Spring
    location /api/ {
        proxy_pass http://crop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;           # 사진 업로드 (nginx 기본 1MB → 413)
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;          # AI 진단 대기
    }
}
