spring.application.name=crop-backend
server.port=8080

# ── DB ── 비밀번호는 환경변수 DB_PASSWORD 로만 받음 (없으면 시작 실패)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:my_ncpms}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:crop_backend}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# 목록 조회 시 후보·병 정보를 묶어서 가져옴 (N+1 방지)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── 사진 업로드 ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=20MB
app.storage.dir=${UPLOAD_DIR:${user.home}/crop-data/uploads}
app.diagnosis.max-upload-mb=10

# ── AI 서버 (FastAPI) ── 토큰은 AI 서버의 INTERNAL_TOKEN 과 같은 값
app.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
app.ai.token=${INTERNAL_TOKEN:}
app.ai.timeout-seconds=10

# ── 결과 판정 기준 (docs/api-spec.md 3장) ──
app.diagnosis.likely-threshold=0.8
app.diagnosis.uncertain-threshold=0.5

# ── 로그인 (JWT) ── 서명 키는 환경변수 JWT_SECRET (32자 이상, 없으면 시작 실패)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=crop-backend
app.jwt.ttl-minutes=60
# 로그인 연속 실패 시 잠금
app.auth.max-login-failures=5
app.auth.lock-minutes=15

# ── CORS ── React 개발 서버 주소 (쉼표로 여러 개)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
